<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="oscar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="oscar-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="oscar-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Neon Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#oscar-bg)" stroke="#3730a3" stroke-width="1.5" />

  <!-- Outer Luminous Causal Ring "O" -->
  <circle cx="32" cy="32" r="21" stroke="url(#oscar-ring)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="115 15" />

  <!-- Inner Causal Vector Graph Edges -->
  <line x1="22" y1="40" x2="32" y2="20" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <line x1="32" y1="20" x2="42" y2="40" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <line x1="22" y1="40" x2="42" y2="40" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Causal Propagation Shockwave Arc (Dynamic Sweep) -->
  <path d="M 19 28 A 15 15 0 0 1 45 28" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 3" opacity="0.95" filter="url(#glow)" />

  <!-- Causal Graph Nodes -->
  <!-- Origin Root Cause Node (Top Vertex) -->
  <circle cx="32" cy="20" r="5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="32" cy="20" r="3.2" fill="#0284c7" />
  <circle cx="32" cy="20" r="1.4" fill="#ffffff" />

  <!-- Victim Caller Node (Left Bottom - Indigo) -->
  <circle cx="22" cy="40" r="4.2" fill="#6366f1" />
  <circle cx="22" cy="40" r="1.8" fill="#ffffff" />

  <!-- Transit Gateway Node (Right Bottom - Emerald) -->
  <circle cx="42" cy="40" r="4.2" fill="#10b981" />
  <circle cx="42" cy="40" r="1.8" fill="#ffffff" />

  <!-- Active Target Root Core Beacon (Center Pulse) -->
  <circle cx="32" cy="33" r="2.5" fill="url(#oscar-pulse)" filter="url(#glow)" />
</svg>